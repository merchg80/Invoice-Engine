name: Generate Invoices

on:
  workflow_dispatch:
    inputs:
      billing_month:
        description: "Billing month (YYYY-MM)"
        required: true
        default: "2026-01"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python src/invoice_engine/stamp.py "${{ inputs.billing_month }}"

      - uses: actions/upload-artifact@v4
        with:
          name: invoices-${{ inputs.billing_month }}
          path: out/Invoice_*.pdf
